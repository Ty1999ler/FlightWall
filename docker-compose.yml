# Runs on the Synology DS1522+ (Container Manager, or `sudo docker-compose up -d`
# over SSH), same pattern as family-hub.
#
# One-time setup on the NAS — see README.md for the full walkthrough:
#   1. Replace GITHUB_USER/REPO below with your GitHub repo (lowercase).
#   2. Copy .env.example to .env next to this file and paste in the
#      Cloudflare tunnel token.
#   3. The existing family-hub Watchtower already watches labeled containers,
#      so updates deploy automatically ~5 minutes after a push to main.
#
# config.json lives in ./data on the NAS (bind mount), so the saved home
# location survives image updates.

services:
  flightwall:
    image: ghcr.io/GITHUB_USER/REPO:latest
    container_name: flightwall
    ports:
      - "8484:8000"   # http://NAS-IP:8484 on the LAN
    volumes:
      # Create this dir BEFORE first start and chown it to the container user,
      # or saved settings silently reset on every update:
      #   sudo mkdir -p /volume1/docker/flightwall/data
      #   sudo chown 1000 /volume1/docker/flightwall/data
      - /volume1/docker/flightwall/data:/data
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: flightwall-cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
