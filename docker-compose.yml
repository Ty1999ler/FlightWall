# Runs on the Synology DS1522+ (Container Manager, or `sudo docker-compose up -d`
# over SSH), same pattern as family-hub.
#
# One-time setup on the NAS — see README.md for the full walkthrough:
#   1. Copy .env.example to .env next to this file and paste in the
#      Cloudflare tunnel token (only needed for remote HTTPS access).
#   2. The existing family-hub Watchtower already watches labeled containers,
#      so updates deploy automatically ~5 minutes after a push to main.
#
# config.json lives in ./data on the NAS (bind mount), so the saved home
# location survives image updates.

services:
  flightwall:
    image: ghcr.io/ty1999ler/flightwall:latest
    container_name: flightwall
    ports:
      - "8484:8000"   # http://NAS-IP:8484 on the LAN
    volumes:
      # Create this dir BEFORE first start and chown it to the container user,
      # or saved settings silently reset on every update:
      #   sudo mkdir -p /volume1/docker/flightwall/data
      #   sudo chown 1000 /volume1/docker/flightwall/data
      - /volume1/docker/flightwall/data:/data
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Auto-deploys new images pushed by GitHub Actions. If another Watchtower
  # already runs on this NAS (e.g. family-hub's), don't start a second one —
  # bring up just the app with: sudo docker-compose up -d flightwall
  watchtower:
    image: containrrr/watchtower:latest
    container_name: flightwall-watchtower
    environment:
      - DOCKER_CONFIG=/config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the directory, not config.json itself: `docker login` replaces
      # the file (new inode), and a single-file bind mount would keep serving
      # the old, expired credentials to Watchtower forever.
      - /root/.docker:/config:ro
    command: --label-enable --cleanup --interval 300
    restart: unless-stopped

  # Optional: only needed if no cloudflared tunnel runs on the NAS already.
  # A plain `docker-compose up -d` skips this service; start it with
  # `docker-compose --profile tunnel up -d` (requires TUNNEL_TOKEN in .env).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: flightwall-cloudflared
    profiles: ["tunnel"]
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
